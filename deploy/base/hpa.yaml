# HorizontalPodAutoscaler: scales the Deployment between min and max replicas
# to keep average CPU at ~70 % of the *requested* CPU. Needs metrics-server.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bags-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bags-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60   # lab value; production is often 300 to avoid flapping
