# PrometheusRule (CRD): recording rules (pre-computed queries) + alerting rules.
# Alerts fire in Prometheus, then Alertmanager groups/routes/silences them.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: bags-api
  labels:
    app: bags-api
spec:
  groups:
    - name: bags-api.recording
      rules:
        - record: bags:requests:rate5m
          expr: sum(rate(http_requests_total{service="bags-api",path="/bags"}[5m]))
        - record: bags:error_ratio:rate5m
          expr: |
            sum(rate(http_requests_total{service="bags-api",path="/bags",status=~"5.."}[5m]))
            /
            sum(rate(http_requests_total{service="bags-api",path="/bags"}[5m]))
        - record: bags:latency_p95:rate5m
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(http_request_duration_seconds_bucket{service="bags-api",path="/bags"}[5m])))
    - name: bags-api.alerts
      rules:
        - alert: BagsApiHighErrorRate
          expr: bags:error_ratio:rate5m > 0.05
          for: 2m                     # lab value; production often 5-10m or SLO burn-rate alerts
          labels:
            severity: warning
            team: infrastructure
          annotations:
            summary: "bags-api 5xx ratio is {{ $value | humanizePercentage }}"
            description: "More than 5 % of /bags requests are failing for 2 minutes."
            runbook_url: "https://github.com/CHANGE_ME/tgtg-lab/blob/main/RUNBOOK.md#bagsapihigherrorrate"
        - alert: BagsApiHighLatency
          expr: bags:latency_p95:rate5m > 0.5
          for: 3m
          labels:
            severity: warning
            team: infrastructure
          annotations:
            summary: "bags-api p95 latency is {{ $value | humanizeDuration }}"
            runbook_url: "https://github.com/CHANGE_ME/tgtg-lab/blob/main/RUNBOOK.md#bagsapihighlatency"
        - alert: BagsApiNoReadyPods
          expr: kube_deployment_status_replicas_available{namespace="bags",deployment="bags-api"} < 1
          for: 1m
          labels:
            severity: critical
            team: infrastructure
          annotations:
            summary: "bags-api has no available pods"
            runbook_url: "https://github.com/CHANGE_ME/tgtg-lab/blob/main/RUNBOOK.md#bagsapinoreadypods"
